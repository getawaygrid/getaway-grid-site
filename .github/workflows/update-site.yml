name: Update site

on:
  schedule:
    - cron: "17 * * * *"      # every hour (minute 17, to avoid the busy top of the hour)
  workflow_dispatch:           # "Run workflow" button in the Actions tab
  push:
    branches: [main]

permissions:
  contents: write              # to save data/*.json, which keeps the hourly schedule alive
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: pages
        uses: actions/configure-pages@v5

      - name: Fetch public videos from YouTube
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python generator/fetch.py

      - name: Build pages
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: python generator/build.py

      - name: Save the video list if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "New videos on the channel [skip ci]"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
